<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio Voz - Teste de Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card-checkout { background: white; border-radius: 2rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); }
        .pix-zone { background-color: #f0f9ff; border: 2px dashed #bae6fd; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="card-checkout w-full max-w-lg p-8 border border-gray-100">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black text-gray-900 tracking-tight italic">ESTÚDIO VOZ IA</h1>
            <p class="text-gray-500 mt-2 font-medium">Ambiente de Teste de Pagamento</p>
        </div>

        <!-- Formulário -->
        <form id="testForm" class="space-y-5">
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1 tracking-widest">Texto de Teste</label>
                <textarea id="texto" rows="3" class="w-full p-4 rounded-2xl border border-gray-200 focus:ring-2 focus:ring-blue-500 outline-none transition-all resize-none text-sm" placeholder="Escreva algo curto..."></textarea>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">WhatsApp</label>
                    <input type="tel" id="whatsapp" placeholder="11999999999" class="w-full p-3 rounded-xl border border-gray-200 text-sm outline-none" required>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">CPF ou CNPJ</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" class="w-full p-3 rounded-xl border border-gray-200 text-sm outline-none" required>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl shadow-lg transition-all active:scale-95 disabled:opacity-50 uppercase text-xs tracking-widest">
                Gerar PIX de Teste (R$ 10,00)
            </button>
        </form>

        <!-- Área do QR Code (Escondida) -->
        <div id="checkoutArea" class="hidden mt-8 animate-in fade-in zoom-in duration-500">
            <div class="pix-zone p-8 rounded-3xl text-center">
                <h3 class="text-blue-900 font-extrabold text-lg mb-6">QR Code Gerado! ✅</h3>
                
                <div class="bg-white p-3 inline-block rounded-2xl shadow-md mb-8">
                    <img id="qrCodeImg" src="" alt="QR Code" class="w-48 h-48 rounded-lg border border-gray-50">
                </div>

                <div class="text-left mb-6">
                    <label class="text-[10px] font-bold text-blue-400 uppercase tracking-widest">Código Copia e Cola</label>
                    <div id="payload" class="mt-2 p-4 bg-white border border-blue-100 rounded-xl text-[10px] font-mono break-all text-gray-600 leading-relaxed shadow-sm">
                        A processar...
                    </div>
                </div>

                <button onclick="copyToClipboard()" class="w-full bg-blue-900 text-white font-bold py-4 rounded-xl text-xs hover:bg-black transition-all shadow-lg active:scale-95">
                    COPIAR CÓDIGO PIX
                </button>
                
                <p class="text-[9px] text-blue-400 mt-6 font-bold uppercase tracking-tighter">O n8n está à espera do seu pagamento para iniciar a gravação</p>
            </div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('btnSubmit');
        const webhookUrl = 'https://estudio-n8n.baatq5.easypanel.host/webhook-test/novo-pedido';

        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.innerText = "A COMUNICAR COM O ASAAS...";
            btn.disabled = true;

            const payload = {
                texto: document.getElementById('texto').value,
                voz: 'francisca',
                whatsapp: document.getElementById('whatsapp').value,
                cpf_cnpj: document.getElementById('cpf').value,
                trilha: 'none'
            };

            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                console.log("Resposta do n8n:", data);

                // Lógica para lidar com lista [0] ou objeto direto {}
                const result = Array.isArray(data) ? data[0] : data;

                if (result && result.encodedImage) {
                    document.getElementById('testForm').classList.add('hidden');
                    document.getElementById('checkoutArea').classList.remove('hidden');
                    
                    // CORREÇÃO: Aplica o prefixo Base64 e o código que vem do Asaas
                    document.getElementById('qrCodeImg').src = `data:image/png;base64,${result.encodedImage}`;
                    document.getElementById('payload').innerText = result.payload;
                    window.lastPix = result.payload;
                } else {
                    alert("O Asaas devolveu os dados, mas não encontrámos a imagem. Verifique o nó 'Get QR Code'.");
                    btn.innerText = "TENTAR NOVAMENTE";
                    btn.disabled = false;
                }

            } catch (error) {
                console.error("Erro no Fetch:", error);
                alert("Erro de conexão. Verifique se clicou em 'Listen for Test Event' no n8n.");
                btn.innerText = "TENTAR NOVAMENTE";
                btn.disabled = false;
            }
        });

        function copyToClipboard() {
            if (window.lastPix) {
                const el = document.createElement('textarea');
                el.value = window.lastPix;
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                alert("PIX Copiado com sucesso!");
            }
        }
    </script>
</body>
</html>
