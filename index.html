<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio Voz - Gravação IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card-main { background: white; border-radius: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05); }
        .pix-container { background-color: #f0fdf4; border: 2px dashed #22c55e; }
        /* Estilo para deixar o player de áudio menor e mais bonito */
        audio { height: 36px; width: 100%; border-radius: 0.5rem; outline: none; }
        audio::-webkit-media-controls-enclosure { background-color: #f1f5f9; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 py-12">

    <div class="card-main w-full max-w-lg p-8 md:p-10 border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-gray-900 tracking-tight italic uppercase">ESTÚDIO VOZ IA</h1>
            <p class="text-gray-500 mt-2 font-medium italic text-sm">Sua propaganda profissional por apenas <span class="text-green-600 font-bold">R$ 10,00</span></p>
        </div>

        <!-- NOVO: Área de Demonstração -->
        <div class="mb-8 p-5 bg-blue-50 border border-blue-100 rounded-2xl">
            <h3 class="text-[11px] font-black text-blue-900 uppercase tracking-widest mb-3">🎧 Ouça nossa qualidade</h3>
            
            <div class="space-y-4">
                <!-- Demo Voz -->
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase mb-1">Voz Padrão: Locutor Carlos</label>
                    <audio controls preload="none">
                        <source src="URL_DO_AUDIO_DEMO_CARLOS.mp3" type="audio/mpeg">
                        Seu navegador não suporta áudio.
                    </audio>
                </div>

                <!-- Demos Trilhas -->
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <div>
                        <label class="block text-[9px] font-bold text-gray-400 uppercase mb-1">Trilha Animada</label>
                        <audio controls preload="none">
                            <source src="URL_DA_TRILHA_ANIMADA.mp3" type="audio/mpeg">
                        </audio>
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold text-gray-400 uppercase mb-1">Trilha Suave</label>
                        <audio controls preload="none">
                            <source src="URL_DA_TRILHA_SUAVE.mp3" type="audio/mpeg">
                        </audio>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mensagens de Erro/Status -->
        <div id="statusBox" class="hidden mb-6 p-4 rounded-2xl text-xs font-bold text-center border-2"></div>

        <form id="mainForm" class="space-y-5">
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2 ml-2 text-left tracking-widest">Texto para Locução</label>
                <textarea id="texto" rows="4" class="w-full p-5 rounded-2xl border border-gray-100 bg-gray-50 focus:bg-white focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all resize-none text-sm" placeholder="Digite seu roteiro..."></textarea>
                <p class="text-[10px] text-gray-400 mt-2 text-right font-bold uppercase"><span id="wordCount">0</span> / 120 palavras</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- NOVO: Seleção de Trilha -->
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2 ml-2 text-left">Escolha a Trilha</label>
                    <select id="trilha" class="w-full p-4 rounded-2xl border border-gray-100 bg-gray-50 text-sm font-medium outline-none focus:ring-2 focus:ring-blue-100">
                        <!-- O atributo "value" é o nome exato do arquivo lá no Cloudinary -->
                        <option value="sem_trilha">Sem Trilha (Apenas Voz)</option>
                        <option value="trilha_animada">Varejo / Animada</option>
                        <option value="trilha_suave">Institucional / Suave</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2 ml-2 text-left">WhatsApp</label>
                    <input type="tel" id="whatsapp" placeholder="(DDD) 99999-9999" class="w-full p-4 rounded-2xl border border-gray-100 bg-gray-50 text-sm outline-none focus:ring-2 focus:ring-blue-100" required>
                </div>
            </div>
            
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2 ml-2 text-left">Nome ou Empresa</label>
                <input type="text" id="nome" placeholder="Como devemos chamar você?" class="w-full p-4 rounded-2xl border border-gray-100 bg-gray-50 text-sm outline-none focus:ring-2 focus:ring-blue-100" required>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl shadow-xl transition-all transform active:scale-95 disabled:opacity-50 uppercase text-xs tracking-widest">
                Gerar Pagamento PIX
            </button>
        </form>

        <!-- Checkout Area (Mesmo código atual) -->
        <div id="checkoutArea" class="hidden mt-8 text-center animate-fade-in">
            <div class="pix-container p-8 rounded-[2rem]">
                <h3 class="text-green-900 font-black text-lg mb-6 uppercase tracking-widest italic">Pagamento Gerado! ✅</h3>
                <div class="bg-white p-3 inline-block rounded-2xl shadow-lg mb-6">
                    <img id="qrCodeDisplay" src="" alt="QR Code PIX" class="w-48 h-48 rounded-lg">
                </div>
                <div class="text-left mb-6">
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-2">Código PIX Copia e Cola</label>
                    <div id="pixPayload" class="mt-1 p-4 bg-white border border-gray-200 rounded-xl text-[10px] font-mono break-all text-gray-600 max-h-24 overflow-y-auto leading-relaxed"></div>
                </div>
                <button onclick="copyPix()" class="w-full bg-gray-900 text-white font-black py-4 rounded-2xl text-xs hover:bg-black transition-all shadow-lg active:scale-95 uppercase tracking-widest">
                    Copiar Código PIX
                </button>
                <p class="text-[9px] text-green-700 mt-6 font-bold uppercase tracking-tighter">O áudio será enviado após a confirmação do pagamento</p>
            </div>
        </div>
    </div>

    <script>
        // Lógica de formulário mantida 100% igual à versão atual
        const textoArea = document.getElementById('texto');
        const countSpan = document.getElementById('wordCount');
        const btnSubmit = document.getElementById('btnSubmit');
        const statusBox = document.getElementById('statusBox');
        const orderForm = document.getElementById('orderForm');
        const checkoutArea = document.getElementById('checkoutArea');

        const webhookUrl = 'https://estudio-n8n.baatq5.easypanel.host/webhook-test/novo-pedido';

        textoArea.addEventListener('input', () => {
            const words = textoArea.value.trim().split(/\s+/).filter(w => w.length > 0);
            countSpan.innerText = words.length;
            if (words.length > 120) {
                textoArea.value = words.slice(0, 120).join(" ");
                countSpan.innerText = 120;
            }
            btnSubmit.disabled = words.length === 0;
        });

        function setStatus(msg, isError = true) {
            statusBox.innerText = msg;
            statusBox.className = `mb-6 p-4 rounded-2xl text-xs font-bold text-center border-2 ${
                isError ? 'bg-red-50 text-red-600 border-red-200' : 'bg-green-50 text-green-700 border-green-200'
            }`;
            statusBox.classList.remove('hidden');
        }

        orderForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnSubmit.innerText = "CONECTANDO AO BANCO...";
            btnSubmit.disabled = true;
            statusBox.classList.add('hidden');

            const payload = {
                texto: textoArea.value,
                whatsapp: document.getElementById('whatsapp').value,
                nome: document.getElementById('nome').value,
                // NOVO: Enviando a escolha da trilha para o n8n
                trilha_escolhida: document.getElementById('trilha').value
            };

            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("Erro na conexão.");

                const data = await response.json();
                const result = Array.isArray(data) ? data[0] : data;

                if (result && result.encodedImage) {
                    orderForm.classList.add('hidden');
                    checkoutArea.classList.remove('hidden');
                    document.getElementById('qrCodeDisplay').src = `data:image/png;base64,${result.encodedImage}`;
                    document.getElementById('pixPayload').innerText = result.payload;
                    window.currentPix = result.payload;
                } else {
                    throw new Error("Erro no processamento do banco.");
                }

            } catch (err) {
                console.error(err);
                setStatus("Falha ao comunicar com o servidor.");
                btnSubmit.disabled = false;
                btnSubmit.innerText = "TENTAR NOVAMENTE";
            }
        });

        function copyPix() {
            if (window.currentPix) {
                navigator.clipboard.writeText(window.currentPix);
                setStatus("PIX Copiado com sucesso!", false);
            }
        }
    </script>
</body>
</html>
