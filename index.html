<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio Voz - Automação IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-panel w-full max-w-2xl rounded-2xl shadow-xl p-8">
        <!-- Cabeçalho -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">🎙️ Estúdio de Gravação IA</h1>
            <p class="text-gray-500">Locução profissional entregue em minutos. Até 120 palavras por apenas <span class="font-bold text-green-600">R$ 10,00</span>.</p>
        </div>

        <form id="orderForm" class="space-y-6">
            <!-- Texto da Locução -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">O seu Texto para Gravação</label>
                <textarea id="clientText" rows="6" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors resize-none" placeholder="Escreva aqui o texto que a IA vai narrar..."></textarea>
                <div class="flex justify-between items-center mt-2">
                    <span id="wordCountMsg" class="text-sm text-gray-500">Palavras: <span id="wordCount">0</span> / 120</span>
                    <span id="warningMsg" class="text-sm text-red-500 hidden font-semibold">Limite de 120 palavras atingido!</span>
                </div>
            </div>

            <!-- Seleção de Vozes -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-3">Escolha a Voz</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="relative flex flex-col p-4 cursor-pointer rounded-lg border bg-white border-gray-200 hover:border-blue-500 transition-all has-[:checked]:border-blue-500 has-[:checked]:ring-2 has-[:checked]:ring-blue-500">
                        <input type="radio" name="voice" value="francisca" class="peer sr-only" checked>
                        <span class="font-bold text-gray-800">👩 Francisca</span>
                        <span class="text-xs text-gray-500 mt-1">Voz feminina, alegre e comercial.</span>
                    </label>
                    <label class="relative flex flex-col p-4 cursor-pointer rounded-lg border bg-white border-gray-200 hover:border-blue-500 transition-all has-[:checked]:border-blue-500 has-[:checked]:ring-2 has-[:checked]:ring-blue-500">
                        <input type="radio" name="voice" value="carlos" class="peer sr-only">
                        <span class="font-bold text-gray-800">👨 Carlos</span>
                        <span class="text-xs text-gray-500 mt-1">Voz masculina, grave e institucional.</span>
                    </label>
                </div>
            </div>

            <!-- Seleção de Trilha -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Trilha de Fundo</label>
                <select id="backgroundTrack" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white">
                    <option value="none">Sem Trilha (Apenas a voz)</option>
                    <option value="trilha_varejo">Trilha Varejo (Animada)</option>
                    <option value="trilha_emocional">Trilha Emocional (Suave)</option>
                </select>
            </div>

            <!-- Dados de Contato -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">O seu WhatsApp (para receber o áudio)</label>
                <input type="tel" id="clientPhone" placeholder="(00) 00000-0000" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
            </div>

            <!-- Botão de Ação -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg shadow-lg hover:shadow-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed text-lg flex justify-center items-center">
                <span>Gerar Pedido e Pagar via PIX (R$ 10,00)</span>
            </button>
        </form>

        <!-- Área do PIX (Escondida inicialmente) -->
        <div id="pixArea" class="hidden mt-8 p-6 bg-green-50 border border-green-200 rounded-xl text-center">
            <h3 class="text-xl font-bold text-green-800 mb-2">Pedido Recebido!</h3>
            <p class="text-sm text-green-700 mb-4">A aguardar sistema de pagamento PagSeguro...</p>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('clientText');
        const wordCountDisplay = document.getElementById('wordCount');
        const warningMsg = document.getElementById('warningMsg');
        const submitBtn = document.getElementById('submitBtn');
        const maxWords = 120;

        textarea.addEventListener('input', function() {
            let words = this.value.trim().split(/\s+/).filter(word => word.length > 0);
            let currentCount = words.length;
            
            if (currentCount > maxWords) {
                const truncatedText = words.slice(0, maxWords).join(" ");
                this.value = truncatedText;
                currentCount = maxWords;
                warningMsg.classList.remove('hidden');
                textarea.classList.add('border-red-500', 'ring-red-500');
            } else {
                warningMsg.classList.add('hidden');
                textarea.classList.remove('border-red-500', 'ring-red-500');
            }
            
            wordCountDisplay.textContent = currentCount;
            submitBtn.disabled = currentCount === 0;
        });

        submitBtn.disabled = true;

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const payload = {
                texto: textarea.value,
                voz: document.querySelector('input[name="voice"]:checked').value,
                trilha: document.getElementById('backgroundTrack').value,
                whatsapp: document.getElementById('clientPhone').value
            };

            submitBtn.innerHTML = `A processar...`;
            submitBtn.disabled = true;

            // Link do Webhook de Teste atualizado!
            const webhookUrl = 'https://estudio-n8n.baatq5.easypanel.host/webhook-test/novo-pedido'; 

            // Envia os dados para o n8n
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(response => response.json())
              .then(data => {
                  document.getElementById('orderForm').classList.add('hidden');
                  document.getElementById('pixArea').classList.remove('hidden');
              }).catch(error => {
                  alert("Erro ao enviar pedido. Verifique se clicou em 'Listen for Test Event' no n8n.");
                  submitBtn.innerHTML = `Tentar Novamente`;
                  submitBtn.disabled = false;
              });
        });
    </script>
</body>
</html>
