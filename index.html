<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio Voz - Gravação IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card-shadow { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
        .pix-container { background-color: #f0f9ff; border: 2px dashed #bae6fd; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-lg rounded-[2.5rem] card-shadow p-8 md:p-10 border border-gray-100">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black text-gray-900 tracking-tight italic uppercase">ESTÚDIO VOZ IA</h1>
            <p class="text-gray-500 mt-2 font-medium">Sua locução profissional por <span class="text-green-600 font-bold italic">R$ 10,00</span></p>
        </div>

        <div id="statusMessage" class="hidden mb-6 p-4 rounded-2xl text-sm font-semibold text-center"></div>

        <form id="orderForm" class="space-y-5">
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2 tracking-widest text-left ml-2">Texto da Locução</label>
                <textarea id="texto" rows="4" class="w-full p-5 rounded-2xl border border-gray-100 bg-gray-50 focus:bg-white focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all resize-none text-sm" placeholder="Digite seu roteiro promocional..."></textarea>
                <div class="flex justify-between mt-2 px-2">
                    <span class="text-[10px] text-gray-400 font-bold uppercase"><span id="wordCount">0</span> / 120 palavras</span>
                </div>
            </div>

            <!-- Indicador Visual de Voz Única -->
            <div class="flex items-center justify-center p-4 bg-blue-50 border border-blue-100 rounded-2xl">
                <span class="font-bold text-blue-900 text-sm">👨 Voz Padrão: Locutor Carlos</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2 ml-2 text-left">Trilha de Fundo</label>
                    <select id="trilha" class="w-full p-4 rounded-2xl border border-gray-100 bg-gray-50 text-sm font-medium outline-none">
                        <option value="none">Voz Pura (Sem trilha)</option>
                        <option value="trilha_varejo">Varejo (Animada)</option>
                        <option value="trilha_emocional">Suave (Institucional)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2 ml-2 text-left">Seu WhatsApp</label>
                    <input type="tel" id="whatsapp" placeholder="(DDD) 99999-9999" class="w-full p-4 rounded-2xl border border-gray-100 bg-gray-50 text-sm font-medium outline-none" required>
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-2 ml-2 text-left">Nome ou Empresa</label>
                <input type="text" id="nome" placeholder="Como devemos te chamar?" class="w-full p-4 rounded-2xl border border-gray-100 bg-gray-50 text-sm font-medium outline-none" required>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl shadow-xl transition-all active:scale-95 disabled:opacity-50 uppercase text-xs tracking-widest">
                Gerar Pagamento PIX
            </button>
        </form>

        <!-- Área de Checkout -->
        <div id="checkoutArea" class="hidden mt-8 animate-fade-in">
            <div class="pix-container p-8 rounded-[2rem] text-center shadow-inner">
                <h3 class="text-blue-900 font-black text-lg mb-6 uppercase tracking-wider italic">Pagamento Gerado!</h3>
                <div class="bg-white p-3 inline-block rounded-2xl shadow-xl mb-8">
                    <img id="qrCodeDisplay" src="" alt="QR Code PIX" class="w-48 h-48 rounded-lg">
                </div>
                <div class="text-left mb-6">
                    <label class="text-[10px] font-bold text-blue-400 uppercase ml-1">Código Copia e Cola</label>
                    <div id="pixText" class="mt-2 p-4 bg-white border border-blue-100 rounded-xl text-[10px] font-mono break-all text-gray-500 leading-relaxed max-h-24 overflow-y-auto"></div>
                </div>
                <button onclick="copyPixCode()" class="w-full bg-blue-900 text-white font-black py-4 rounded-2xl text-xs hover:bg-black transition-all shadow-lg active:scale-95 uppercase">
                    Copiar Código PIX
                </button>
            </div>
        </div>
    </div>

    <script>
        const textoArea = document.getElementById('texto');
        const countSpan = document.getElementById('wordCount');
        const btnSubmit = document.getElementById('btnSubmit');
        const statusBox = document.getElementById('statusMessage');
        const orderForm = document.getElementById('orderForm');
        const checkoutArea = document.getElementById('checkoutArea');

        const n8nWebhookUrl = 'https://estudio-n8n.baatq5.easypanel.host/webhook-test/novo-pedido';

        textoArea.addEventListener('input', () => {
            const words = textoArea.value.trim().split(/\s+/).filter(w => w.length > 0);
            countSpan.innerText = words.length;
            if (words.length > 120) {
                textoArea.value = words.slice(0, 120).join(" ");
                countSpan.innerText = 120;
            }
            btnSubmit.disabled = words.length === 0;
        });

        function setStatus(msg, isError = true) {
            statusBox.innerText = msg;
            statusBox.className = `mb-6 p-4 rounded-2xl text-sm font-bold text-center border-2 ${
                isError ? 'bg-red-50 text-red-600 border-red-100' : 'bg-green-50 text-green-600 border-green-100'
            }`;
            statusBox.classList.remove('hidden');
        }

        orderForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnSubmit.innerText = "GERANDO PIX...";
            btnSubmit.disabled = true;
            statusBox.classList.add('hidden');

            const payload = {
                texto: textoArea.value,
                voz: 'carlos', // Definido fixamente no código
                trilha: document.getElementById('trilha').value,
                whatsapp: document.getElementById('whatsapp').value,
                nome: document.getElementById('nome').value
            };

            try {
                const response = await fetch(n8nWebhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                const result = Array.isArray(data) ? data[0] : data;

                if (result && result.encodedImage) {
                    orderForm.classList.add('hidden');
                    checkoutArea.classList.remove('hidden');
                    document.getElementById('qrCodeDisplay').src = `data:image/png;base64,${result.encodedImage}`;
                    document.getElementById('pixText').innerText = result.payload;
                    window.currentPixCode = result.payload;
                } else {
                    throw new Error("O servidor não devolveu o QR Code.");
                }

            } catch (err) {
                console.error(err);
                setStatus("Erro de conexão. Tente novamente.");
                btnSubmit.innerText = "TENTAR NOVAMENTE";
                btnSubmit.disabled = false;
            }
        });

        function copyPixCode() {
            if (window.currentPixCode) {
                navigator.clipboard.writeText(window.currentPixCode);
                setStatus("Código PIX copiado!", false);
            }
        }
    </script>
</body>
</html>
